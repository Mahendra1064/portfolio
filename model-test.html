<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GK Model Test | Mahendra Kumar Sijapati</title>
    <meta name="description" content="General knowledge model test with multiple-choice questions, answers, and explanations.">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --ink: #0f172a;
            --muted: #64748b;
            --gold: #eab308;
            --paper: #f8fafc;
            --white: #ffffff;
            --line: #dbe3ec;
        }

        * { box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        body {
            margin: 0;
            min-height: 100vh;
            color: var(--ink);
            background: radial-gradient(circle at top right, #fef3c7 0, transparent 32%), var(--paper);
            font-family: Georgia, 'Times New Roman', serif;
        }

        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 18px;
            padding: 18px 6%;
            background: rgba(15, 23, 42, 0.97);
            color: white;
        }

        .brand { font-size: 18px; font-weight: 700; letter-spacing: 0.03em; }
        .back-link {
            color: white;
            text-decoration: none;
            font: 700 14px Arial, sans-serif;
        }
        .back-link i { color: var(--gold); margin-right: 8px; }

        main { width: min(1080px, 92%); margin: 0 auto; padding: 68px 0 90px; }
        .intro { max-width: 700px; margin-bottom: 30px; }
        .eyebrow {
            margin: 0 0 10px;
            color: #a16207;
            font: 700 12px Arial, sans-serif;
            letter-spacing: 0.18em;
            text-transform: uppercase;
        }
        h1 { margin: 0 0 12px; font-size: clamp(34px, 6vw, 58px); line-height: 1.02; }
        .intro p { color: var(--muted); font: 16px/1.7 Arial, sans-serif; }

        .test-box {
            padding: clamp(20px, 4vw, 34px);
            background: var(--white);
            border: 1px solid var(--line);
            border-radius: 18px;
            box-shadow: 0 20px 50px rgba(15, 23, 42, 0.1);
        }
        .tab-bar { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 24px; }
        .tab, .test-nav button {
            border: 0;
            border-radius: 999px;
            padding: 11px 16px;
            color: var(--ink);
            background: #e8eef4;
            font: 700 14px Arial, sans-serif;
            cursor: pointer;
        }
        .tab.active, .test-nav .next { background: var(--gold); }
        .question-card { padding: clamp(18px, 4vw, 28px); border: 1px solid var(--line); border-radius: 14px; background: linear-gradient(#fff, #f8fafc); }
        .meta { display: flex; justify-content: space-between; gap: 12px; margin-bottom: 18px; color: var(--muted); font: 700 13px Arial, sans-serif; }
        h2 { margin: 0 0 22px; font-size: clamp(20px, 3vw, 27px); line-height: 1.45; }
        .options { display: grid; gap: 11px; }
        .option {
            width: 100%;
            padding: 14px 16px;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            color: var(--ink);
            background: white;
            text-align: left;
            font: 15px/1.45 Arial, sans-serif;
            cursor: pointer;
        }
        .option:hover:not(:disabled) { border-color: var(--gold); background: #fefce8; }
        .option.correct { border-color: #22c55e; background: #dcfce7; color: #166534; }
        .option.incorrect { border-color: #ef4444; background: #fee2e2; color: #991b1b; }
        .answer { display: none; margin-top: 20px; padding: 16px; border: 1px solid #bfdbfe; border-radius: 11px; color: #1e3a8a; background: #eff6ff; font: 15px/1.6 Arial, sans-serif; }
        .answer.visible { display: block; }
        .answer strong { display: block; margin-bottom: 6px; }
        .test-nav { display: flex; justify-content: space-between; gap: 12px; margin-top: 22px; }
        .test-nav button:disabled { cursor: default; opacity: 0.45; }
        .score { margin-top: 14px; padding: 13px 15px; border: 1px solid #facc15; border-radius: 10px; color: #713f12; background: #fefce8; font: 700 14px Arial, sans-serif; }
        .error { padding: 18px; color: #991b1b; background: #fee2e2; border-radius: 10px; font: 15px/1.5 Arial, sans-serif; }
        @media (max-width: 600px) { .topbar { align-items: flex-start; flex-direction: column; } .meta { align-items: flex-start; flex-direction: column; } }
    </style>
</head>
<body>
    <header class="topbar">
        <div class="brand"><i class="fa-solid fa-clipboard-question"></i> GK Model Test</div>
        <a class="back-link" href="index.html"><i class="fa-solid fa-arrow-left"></i>Back to portfolio</a>
    </header>
    <main>
        <div class="intro">
            <p class="eyebrow">Practice desk</p>
            <h1>General Knowledge Model Test</h1>
            <p>Choose a syllabus section, select an answer, and review the explanation before moving to the next question.</p>
        </div>
        <section class="test-box" aria-label="GK multiple-choice test">
            <div id="tabBar" class="tab-bar"></div>
            <div id="testArea"><p>Loading questions...</p></div>
        </section>
    </main>
    <script>
        const state = { section: 'geography', index: 0 };
        let questionBank;

        async function loadQuestionBank() {
            const response = await fetch('index.html');
            if (!response.ok) throw new Error('Question bank could not be loaded.');
            const source = await response.text();
            const start = source.indexOf('const gkQuestionBank = ');
            const end = source.indexOf(';\n\n        const gkState', start);
            if (start < 0 || end < 0) throw new Error('Question bank is missing from the portfolio source.');
            const declaration = source.slice(start, end + 1);
            questionBank = Function(`${declaration}; return gkQuestionBank;`)();
            renderTabs();
            renderQuestion();
        }

        function renderTabs() {
            const tabs = document.getElementById('tabBar');
            tabs.innerHTML = Object.entries(questionBank).map(([key, section]) => `
                <button class="tab ${key === state.section ? 'active' : ''}" type="button" data-section="${key}">${section.title}</button>
            `).join('');
            tabs.querySelectorAll('.tab').forEach((button) => {
                button.addEventListener('click', () => {
                    state.section = button.dataset.section;
                    state.index = 0;
                    renderTabs();
                    renderQuestion();
                });
            });
        }

        function renderQuestion() {
            const section = questionBank[state.section];
            const question = section.questions[state.index];
            const total = section.questions.length;
            document.getElementById('testArea').innerHTML = `
                <article class="question-card">
                    <div class="meta"><span>${section.title}</span><span>Question ${state.index + 1} / ${total}</span></div>
                    <h2>Q${state.index + 1}. ${question.q}</h2>
                    <div class="options">${question.options.map((option) => `<button class="option" type="button" data-option="${option}">${option}</button>`).join('')}</div>
                    <div class="answer" id="answer"><strong>Correct answer: ${question.answer}</strong><span>${question.explanation}</span></div>
                    <div class="test-nav"><button type="button" id="previous" ${state.index === 0 ? 'disabled' : ''}>Previous</button><button class="next" type="button" id="next">${state.index === total - 1 ? 'Finish' : 'Next'}</button></div>
                    <div class="score" id="score">Choose an option to check your answer.</div>
                </article>
            `;
            const options = document.querySelectorAll('.option');
            options.forEach((button) => button.addEventListener('click', () => {
                const chosen = button.dataset.option;
                options.forEach((option) => {
                    option.disabled = true;
                    if (option.dataset.option === question.answer) option.classList.add('correct');
                    if (option.dataset.option === chosen && chosen !== question.answer) option.classList.add('incorrect');
                });
                document.getElementById('answer').classList.add('visible');
                document.getElementById('score').textContent = chosen === question.answer ? 'Correct answer.' : 'Review the explanation above.';
            }));
            document.getElementById('previous').addEventListener('click', () => { state.index--; renderQuestion(); });
            document.getElementById('next').addEventListener('click', () => { if (state.index < total - 1) { state.index++; renderQuestion(); } });
        }

        loadQuestionBank().catch((error) => { document.getElementById('testArea').innerHTML = `<div class="error">${error.message} Please open this page through the published website rather than directly from a local file.</div>`; });
    </script>
</body>
</html>
